name: quality-gate

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .cache
          key: ao-cdn-cache-${{ github.run_id }}
          restore-keys: |
            ao-cdn-cache-

      - run: pnpm install --frozen-lockfile

      - name: Sync AO catalogue
        run: pnpm sync:ao

      - run: pnpm exec vitest run --coverage

      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec jscpd .
        continue-on-error: true

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec knip
        continue-on-error: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  summary:
    needs: [lint, typecheck, coverage, duplication, dead-code, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary body
        id: body
        run: |
          {
            echo "body<<EOF"
            echo "## Quality Gate Summary"
            echo ""
            echo "| Metric | Result |"
            echo "|---|---|"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| typecheck | ${{ needs.typecheck.result }} |"
            echo "| coverage | ${{ needs.coverage.result }} |"
            echo "| duplication | ${{ needs.duplication.result }} |"
            echo "| dead-code | ${{ needs.dead-code.result }} |"
            echo "| audit | ${{ needs.audit.result }} |"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-gate
          message: ${{ steps.body.outputs.body }}

name: docker-publish

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lucasgitdev/albion-comp-maker:latest
            lucasgitdev/albion-comp-maker:${{ github.sha }}

      - name: Trigger EasyPanel deploy
        run: |
          curl -fsSL -X POST "${{ secrets.EASYPANEL_WEBHOOK_URL }}"
